# Joinr Finance: a generic single-container compose file for building and running the image
# locally. The Umbrel deployment does NOT use this file: its compose lives in the app store
# repository (tenon-umbrel-store/tenon-joinr-finance/docker-compose.yml) and pins the image built
# on the Umbrel by tag and digest; see docs/deploy/RUNBOOK.md.
#
#   docker compose up -d --build
#
# The data folder must exist and be writable by uid 1000 (the image's `node` user), otherwise
# Docker creates it owned by root and the app cannot open its database:
#   mkdir -p ./data && sudo chown 1000:1000 ./data

services:
  joinr-finance:
    build: .
    image: joinr-finance:local
    init: true
    restart: unless-stopped
    # Time for the server to finish a backup or a price write and close SQLite cleanly.
    stop_grace_period: 30s
    # Loopback only: the app has no login of its own. On the Umbrel the app proxy, which puts the
    # Umbrel login in front, is the only way in, and that compose publishes no port. Never publish
    # this port on all interfaces (LAN or tailnet).
    ports:
      - '127.0.0.1:${JOINR_PORT:-3001}:3001'
    volumes:
      - '${JOINR_DATA_PATH:-./data}:/data'
    environment:
      # The server's time zone decides the 23:00 month-end record and the 02:30 nightly backup.
      # The Umbrel compose sets Australia/Melbourne; set TZ in your shell or an .env file here.
      TZ: '${TZ:-UTC}'
